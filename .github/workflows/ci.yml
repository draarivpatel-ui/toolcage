name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  node18-ubuntu:
    name: Node 18 / Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '18'
      - run: node scripts/build-cjs.mjs --check
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-types.mjs
      - run: node scripts/cli-smoke.mjs
      - run: node scripts/check-pack.mjs

  node20-ubuntu:
    name: Node 20 / Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - run: node scripts/build-cjs.mjs --check
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-types.mjs
      - run: node scripts/cli-smoke.mjs
      - run: node scripts/check-pack.mjs

  node22-ubuntu:
    name: Node 22 / Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node scripts/build-cjs.mjs --check
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-types.mjs
      - run: node scripts/cli-smoke.mjs
      - run: node scripts/check-pack.mjs

  node24-ubuntu:
    name: Node 24 / Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/build-cjs.mjs --check
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-types.mjs
      - run: node scripts/cli-smoke.mjs
      - run: node scripts/check-pack.mjs

  node18-windows:
    name: Node 18 / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '18'
      - run: node scripts/build-cjs.mjs --check
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-types.mjs
      - run: node scripts/cli-smoke.mjs
      - run: node scripts/check-pack.mjs

  node20-windows:
    name: Node 20 / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - run: node scripts/build-cjs.mjs --check
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-types.mjs
      - run: node scripts/cli-smoke.mjs
      - run: node scripts/check-pack.mjs

  node22-windows:
    name: Node 22 / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node scripts/build-cjs.mjs --check
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-types.mjs
      - run: node scripts/cli-smoke.mjs
      - run: node scripts/check-pack.mjs

  node24-windows:
    name: Node 24 / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/build-cjs.mjs --check
      - run: node scripts/run-tests.mjs
      - run: node scripts/check-types.mjs
      - run: node scripts/cli-smoke.mjs
      - run: node scripts/check-pack.mjs

  fuzz:
    name: fast-check property fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:fuzz
